<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock Ads Advance - Acesso Restrito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-text {
            text-shadow: 0 0 5px #06b6d4, 0 0 20px #06b6d4;
        }
        .neon-pink-text {
            text-shadow: 0 0 5px #ff007f, 0 0 20px #ff007f;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }
        /* Transição suave para o preenchimento do neon */
        path {
            transition: fill 0.4s ease-in-out, filter 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-black text-gray-100 flex items-center justify-center h-screen font-sans overflow-hidden relative">
    
    <div class="absolute inset-0 bg-[linear-gradient(rgba(6,182,212,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(6,182,212,0.05)_1px,transparent_1px)] bg-[size:30px_30px] opacity-30 z-0"></div>

    <div class="relative z-10 bg-gray-950/80 backdrop-blur-md p-8 md:p-12 rounded-xl border border-cyan-500/30 w-[90%] md:w-[420px] text-center neon-border h-[500px] flex flex-col justify-center">
        
        <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-75"></div>

        <div class="mb-6" id="headerBox">
            <h1 class="text-3xl md:text-4xl font-black text-white tracking-widest mb-1 uppercase">Sherlock<span class="text-cyan-400 neon-text"> Ads</span></h1>
            <p class="text-[10px] md:text-xs text-cyan-500/70 uppercase tracking-[0.3em] font-mono">Advance Protocol</p>
        </div>

        <div id="loginBox" class="space-y-6 transition-all duration-500">
            <div class="text-left relative">
                <label class="text-[10px] font-mono text-cyan-500/80 uppercase tracking-widest mb-2 block">Chave de Decodificação</label>
                <div class="relative">
                    <input id="senhaInput" type="password" placeholder="••••••••" class="w-full bg-black/80 border border-cyan-900 text-cyan-50 px-4 py-3 rounded-md outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-center tracking-[0.5em] font-mono z-10 relative placeholder-cyan-900/50" />
                </div>
            </div>
            
            <button onclick="iniciarLeitura()" class="w-full flex flex-col items-center justify-center gap-2 outline-none group mt-4">
                
                <svg id="iconeSeta" viewBox="0 0 50 80" class="w-16 h-24 mx-auto group-hover:scale-105 transition-transform duration-500 cursor-pointer">
                    <defs>
                        <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="gradPink" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff0055;stop-opacity:1" />
                        </linearGradient>
                        
                        <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="2.5" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                        <filter id="neonGlowPink" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3.5" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <path id="chev1" d="M 15 20 L 25 10 L 35 20" fill="none" stroke="url(#gradCyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowCyan)" />
                    <path id="chev2" d="M 15 32 L 25 22 L 35 32" fill="none" stroke="url(#gradCyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowCyan)" />
                    
                    <g filter="url(#neonGlowPink)">
                        <path id="mainArrow" d="M 10 48 L 25 28 L 40 48 L 28 48 L 25 75 L 22 48 Z" fill="none" stroke="url(#gradPink)" stroke-width="2" stroke-linejoin="round" />
                        <path id="centerLine" d="M 25 28 L 25 75" fill="none" stroke="url(#gradPink)" stroke-width="2" />
                    </g>
                </svg>

                <span id="textoSeta" class="text-[10px] text-cyan-600/60 font-mono uppercase tracking-widest group-hover:text-cyan-400 transition-colors mt-2">Iniciar Conexão</span>
            </button>
        </div>
        
        <div id="sucessoBox" class="hidden flex-col items-center justify-center space-y-4 animate-[pulse_2s_ease-in-out_infinite]">
            <svg class="w-20 h-24" viewBox="0 0 50 80">
                <path d="M 15 20 L 25 10 L 35 20" fill="url(#gradCyan)" filter="url(#neonGlowCyan)"/>
                <path d="M 15 32 L 25 22 L 35 32" fill="url(#gradCyan)" filter="url(#neonGlowCyan)"/>
                <path d="M 10 48 L 25 28 L 40 48 L 28 48 L 25 75 L 22 48 Z" fill="url(#gradPink)" filter="url(#neonGlowPink)"/>
            </svg>
            <div class="mt-4">
                <h2 class="text-xl font-bold text-cyan-400 tracking-widest uppercase neon-text">Acesso Liberado</h2>
                <p class="text-sm font-mono text-cyan-500/80 uppercase tracking-widest mt-1">Com Sucesso</p>
            </div>
        </div>

    </div>

    <script>
        function iniciarLeitura() {
            const senha = document.getElementById('senhaInput').value;
            const textoSeta = document.getElementById('textoSeta');
            const loginBox = document.getElementById('loginBox');
            const sucessoBox = document.getElementById('sucessoBox');

            // Verifica se a senha foi digitada
            if (senha.trim() !== '') {
                // Efeito 1: Preenche as setas com as cores do gradiente neon
                document.getElementById('chev1').setAttribute('fill', 'url(#gradCyan)');
                document.getElementById('chev2').setAttribute('fill', 'url(#gradCyan)');
                document.getElementById('mainArrow').setAttribute('fill', 'url(#gradPink)');
                
                textoSeta.innerText = "VERIFICANDO CHAVE...";
                textoSeta.classList.remove('text-cyan-600/60');
                textoSeta.classList.add('text-cyan-400', 'neon-text');

                // Efeito 2: Aguarda 1.5 segundos simulando análise, depois troca para "Acesso Liberado"
                setTimeout(() => {
                    loginBox.style.opacity = '0';
                    setTimeout(() => {
                        loginBox.classList.add('hidden');
                        sucessoBox.classList.remove('hidden');
                        sucessoBox.classList.add('flex');
                    }, 400); // Tempo do fade out
                }, 1500);

            } else {
                // Erro: Pisca em vermelho se tentar clicar sem colocar a senha
                document.getElementById('senhaInput').classList.add('border-red-500', 'ring-1', 'ring-red-500');
                textoSeta.innerText = "INSIRA A CHAVE";
                textoSeta.classList.replace('text-cyan-600/60', 'text-red-500');
                
                setTimeout(() => {
                    document.getElementById('senhaInput').classList.remove('border-red-500', 'ring-1', 'ring-red-500');
                    textoSeta.innerText = "INICIAR CONEXÃO";
                    textoSeta.classList.replace('text-red-500', 'text-cyan-600/60');
                }, 1500);
            }
        }
    </script>
</body>
</html>
